
name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1 -Force

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

      - name: Configure RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Add RDP_PASSWORD in GitHub Actions secrets."
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $existingUser = Get-LocalUser -Name 'RDP' `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
            Set-LocalUser -Name 'RDP' -Password $securePass
          } else {
            New-LocalUser -Name 'RDP' `
              -Password $securePass `
              -AccountNeverExpires
          }

          Add-LocalGroupMember -Group 'Remote Desktop Users' `
            -Member 'RDP' -ErrorAction SilentlyContinue

      - name: Install Tailscale
        shell: powershell
        run: |
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest `
            'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $msi

          Start-Process msiexec.exe `
            -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' `
            -Wait

          Remove-Item $msi -Force

      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Add TAILSCALE_AUTH_KEY in GitHub Actions secrets."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up --authkey="$env:TS_AUTHKEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          $tsIP = $null

          for ($i = 0; $i -lt 12 -and -not $tsIP; $i++) {
            Start-Sleep -Seconds 5
            $result = & $ts ip -4
            if ($LASTEXITCODE -eq 0 -and $result) {
              $tsIP = ($result | Select-Object -First 1).Trim()
            }
          }

          if (-not $tsIP) {
            throw 'Could not obtain a Tailscale IP.'
          }

          "TAILSCALE_IP=$tsIP" | Out-File `
            -FilePath $env:GITHUB_ENV -Append

      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $test = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP -Port 3389

          if (-not $test.TcpTestSucceeded) {
            throw 'RDP port connectivity check failed.'
          }

          Write-Host 'TCP connectivity check passed.'

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "RDP Address: $env:TAILSCALE_IP"
          Write-Host 'Username: RDP'
          Write-Host 'Use the password saved in GitHub Secrets.'
          while ($true) {
            Write-Host "[$(Get-Date)] Runner active"
            Start-Sleep -Seconds 300
          }
