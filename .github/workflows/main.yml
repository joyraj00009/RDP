```yaml
name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create or Update RDP User
        shell: powershell
        run: |
          $password = 'Aa112233@'
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($existingUser) {
              Set-LocalUser -Name "RDP" -Password $securePass
          } else {
              New-LocalUser -Name "RDP" `
                -Password $securePass `
                -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" `
            -Member "RDP" -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Remote Desktop Users" `
            -Member "RDP" -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name "RDP")) {
              throw "RDP user creation failed"
          }

          Write-Host "RDP user configured successfully."

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 | Select-Object -First 1).Trim()

              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              throw "Tailscale IP not assigned. Exiting."
          }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              throw "TCP connection to RDP port 3389 failed"
          }

          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "RDP Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: [configured]"
          Write-Host "Keep this workflow running while using RDP."

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
```
